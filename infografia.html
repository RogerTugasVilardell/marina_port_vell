:root {
  --fons: #fcfcfc;
  --text: #232323;
  --text-sec: #4f4f4f;
  --vora: #CCCCCC;
  --fons-flotant: rgba(255,255,255,0.97);
  --mida-min: 12.5px;      /* cap text per sota (excepcions: estil.md) */
  --ample-max: 960px;
  --font-titol: 'PPPangaia', sans-serif;
  --font-contingut: 'Merriweather', serif;
  --font-ui: 'Roboto', sans-serif;
}

/* ---------- Layout general ---------- */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--fons);
  font-family: var(--font-contingut);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}
.infografia-container {
  width: 100%;
  height: 100%;
  padding: 16px 12px 12px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ---------- Titulació ---------- */
h1.titol {
  font-family: var(--font-titol);
  font-weight: 500;
  font-size: 28px;
  line-height: 1.3;
  color: var(--text);
  margin: 0 0 12px;
  text-align: center;
  width: 100%;
  max-width: var(--ample-max);
}
h1.titol:has(+ .subtitol) { margin-bottom: 4px; }
.subtitol {
  font-family: var(--font-contingut);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-sec);
  margin: 0 0 12px;
  text-align: center;
  width: 100%;
  max-width: var(--ample-max);
}

/* ---------- Llegenda inline (sota la titulació) ---------- */
.llegenda-inline {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 14px;
  margin: 0 0 8px;
  width: 100%;
  max-width: var(--ample-max);
  box-sizing: border-box;
}
.llegenda-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.35;
  color: var(--text);
}
.llegenda-item.petita { font-size: 12.5px; }
.llegenda-swatch {
  width: 16px;
  height: 12px;
  border-radius: 2px;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.12);
}
.llegenda-swatch.linia { height: 3px; border: none; }

/* ---------- Zona del gràfic ---------- */
.mapa-wrapper {
  position: relative;
  width: 100%;
  max-width: var(--ample-max);
  flex: 1;
  min-height: 0;           /* CRÍTIC: permet que flex:1 funcioni en alçada */
}
svg#mapa { display: block; overflow: visible; }
svg#mapa[viewBox] { width: 100%; height: 100%; }   /* només mapes amb viewBox, si es demana */

/* Gràfics de diversos blocs (opcional). Les columnes de .blocs es
   defineixen a cada infografia. */
.blocs { display: grid; width: 100%; height: 100%; gap: 14px; }
.bloc { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bloc-titol {
  font-family: var(--font-contingut);
  font-weight: 700;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  margin: 0 0 2px;
}
.bloc-subtitol {
  font-family: var(--font-contingut);
  font-size: 12.5px;
  line-height: 1.35;
  color: var(--text-sec);
  margin: 0 0 6px;
}
.bloc-grafic { position: relative; flex: 1; min-width: 0; min-height: 0; }
.bloc-grafic > svg { position: absolute; top: 0; left: 0; display: block; overflow: visible; }

/* ---------- Peu de pàgina ---------- */
.peu-pagina {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  padding: 0;
  width: 100%;             /* OBLIGATORI: evita el centrat involuntari */
  max-width: var(--ample-max);
  box-sizing: border-box;
}
.font-text {
  flex: 1;
  padding-right: 14px;
  font-family: var(--font-contingut);
  font-size: 12.5px;
  line-height: 1.35;
  color: var(--text-sec);
  text-align: left;
}
.peu-textos {              /* si el peu té més d'una línia de text */
  flex: 1;
  min-width: 0;
  padding-right: 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.peu-textos .font-text { padding-right: 0; }
.logo-peu { height: 21px; width: auto; flex-shrink: 0; }

/* ---------- Caixes flotants: tooltip i popovers ---------- */
#tooltip, .info-popup {
  position: fixed;
  display: none;
  box-sizing: border-box;
  max-width: 260px;
  padding: 8px 10px;
  background: var(--fons-flotant);
  border: 1px solid var(--vora);
  border-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  font-family: var(--font-contingut);
  font-size: 13px;
  line-height: 1.35;
  color: var(--text);
}
#tooltip { pointer-events: none; z-index: 300; }
.info-popup { z-index: 200; max-height: calc(100vh - 16px); overflow-y: auto; }

/* ---------- Mòbil ---------- */
@media (max-width: 767px) {
  h1.titol { font-size: 20px; }
  .llegenda-item { font-size: 12.5px; }
  .bloc-titol { font-size: 14px; }
  .peu-pagina { flex-direction: column; align-items: flex-start; gap: 4px; }
  .font-text, .peu-textos { padding-right: 0; }
  .logo-peu { height: 18px; align-self: flex-end; }
}

/* ---------- Estils propis d'aquesta infografia ---------- */
svg#mapa { overflow: hidden; }
.zoom-capa { cursor: grab; }
.zoom-capa:active { cursor: grabbing; }
.iots { fill: #BCE0FF; stroke: #2399FF; stroke-width: 0.5px; vector-effect: non-scaling-stroke; }
.contorn { fill: none; stroke-width: 2px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
#zoom-controls { position: absolute; z-index: 10; display: flex; flex-direction: column; gap: 4px; }
.ctrl-btn {
  min-width: 26px; height: 26px; padding: 0 7px; box-sizing: border-box; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--fons-flotant); border: 1px solid var(--vora); border-radius: 4px;
  font-family: var(--font-ui); font-size: 14px; line-height: 1; color: var(--text);
}
.ctrl-btn:hover { background: #f0f0f0; }
@media (max-width: 767px) { .ctrl-btn { font-size: 13px; } }

</style>
</head>
<body>
<div class="infografia-container">
  <h1 class="titol">Marina Port Vell: cada cop menys iots, però més grans</h1>
  <div id="mapa-wrapper" class="mapa-wrapper">
    <svg id="mapa" role="img" aria-label="Plànols de la Marina Port Vell el 2010, el 2014 i el 2024: 410, 148 i 73 places per a iots"></svg>
    <div id="zoom-controls">
      <button class="ctrl-btn" id="zoom-in" aria-label="Apropar">+</button>
      <button class="ctrl-btn" id="zoom-out" aria-label="Allunyar">−</button>
      <button class="ctrl-btn" id="zoom-reset" aria-label="Vista completa">⊙</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
/* ===================== UTILITATS COMUNES ===================== */
const MIDA_MIN = 12.5;                                   // px (estil.md)
const esMobil  = () => window.matchMedia('(max-width: 767px)').matches;
const potHover = () => window.matchMedia('(hover: hover)').matches;

/* Mides de text dins del SVG, en px (taula d'estil.md) */
function mides() {
  const m = esMobil();
  return {
    eix: 12.5,               // Roboto: valors d'eix i etiquetes inline
    titolEix: m ? 12.5 : 14, // Roboto: títols dels eixos
    nota: 12.5,              // Merriweather: notes i anotacions
    text: 14,                // Merriweather: text de contingut
    titolet: m ? 14 : 15     // Merriweather negreta: titolets dibuixats al SVG
  };
}

/* Amplada real d'un text (per calcular marges i si una etiqueta hi cap) */
const _ctx = document.createElement('canvas').getContext('2d');
function mesuraText(text, px, familia = 'Roboto', pes = 400) {
  _ctx.font = `${pes} ${px}px '${familia}', sans-serif`;
  return _ctx.measureText(text).width;
}

/* Format numèric català: punt als milers, coma decimal, màxim un decimal,
   sense zeros decimals finals, % enganxat a la xifra. Més decimals només si
   l'encàrrec ho demana explícitament (paràmetre decimals). */
const localeCA = d3.formatLocale({ decimal: ',', thousands: '.', grouping: [3], currency: ['', ' €'] });
function formatNum(val, sufix = '', decimals = 1) {
  const f = 10 ** decimals;
  const r = Math.sign(val) * Math.round(Math.abs(val) * f) / f;   // arrodoniment simètric
  let s = localeCA.format(`,.${decimals}f`)(r);
  if (s.includes(',')) s = s.replace(/0+$/, '').replace(/,$/, '');  // treu zeros decimals finals
  return s + sufix;
}
// formatNum(12.5, '%') → '12,5%' | formatNum(10, '%') → '10%' | formatNum(18074, ' €') → '18.074 €'
// formatNum(1.5, '', 2) → '1,5' | formatNum(1.25, '', 2) → '1,25'
// Eixos D3: .tickFormat(d => formatNum(d))

/* Tooltip: contingut en Merriweather; tots els textos acaben amb punt */
const tip = document.getElementById('tooltip');
function showTooltip(html) { tip.innerHTML = html; tip.style.display = 'block'; }
function moveTooltip(ev) {
  const M = 8, W = window.innerWidth, H = window.innerHeight;
  tip.style.left = '0px'; tip.style.top = '0px';       // força layout per mesurar
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + tw + M > W) x = ev.clientX - tw - 14;
  if (x < M) x = M;
  if (y + th + M > H) y = ev.clientY - th - 14;
  if (y < M) y = M;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTooltip() { tip.style.display = 'none'; }
/* Hover als dispositius amb ratolí; clic a tots (tacte inclòs) */
function enllacaTooltip(sel, htmlFn) {
  sel.on('mouseover', (ev, d) => { if (potHover()) { showTooltip(htmlFn(d)); moveTooltip(ev); } })
     .on('mousemove', ev => { if (potHover()) moveTooltip(ev); })
     .on('mouseout', () => { if (potHover()) hideTooltip(); })
     .on('click', (ev, d) => { ev.stopPropagation(); showTooltip(htmlFn(d)); moveTooltip(ev); });
}
document.addEventListener('click', hideTooltip);

/* Parteix un text en línies que càpiguen en una amplada */
function parteix(text, ample, px, familia, pes) {
  const paraules = text.split(' '), linies = [];
  let actual = '';
  for (const p of paraules) {
    const prova = actual ? actual + ' ' + p : p;
    if (actual && mesuraText(prova, px, familia, pes) > ample) { linies.push(actual); actual = p; }
    else actual = prova;
  }
  if (actual) linies.push(actual);
  return linies;
}

function textLinies(g, linies, x, y, px, interlineat, attrs) {
  const t = g.append('text').attr('x', x).attr('y', y);
  Object.entries(attrs).forEach(([k, v]) => t.attr(k, v));
  linies.forEach((l, i) => t.append('tspan').attr('x', x).attr('y', y + i * px * interlineat).text(l));
  return t;
}

/* Capes d'un plànol, en metres. ambMB92: només el 2024 */
function dibuixaPlanol(g, any, patro) {
  const [x0, y0] = MAPA.marcComu, x1 = MAPA.marc2024[2], y1 = MAPA.marc2024[3];
  g.append('rect').attr('x', x0 - 10).attr('y', y0 - 10).attr('width', x1 - x0 + 20).attr('height', y1 - y0 + 20)
    .attr('fill', `url(#${patro})`);
  g.append('path').attr('d', MAPA.terra).attr('fill', C.terra);
  g.append('path').attr('d', MAPA.verd).attr('fill', C.verd);
  MAPA.carrers.forEach(c => g.append('path').attr('d', c.d).attr('fill', 'none')
    .attr('stroke', C.carrer).attr('stroke-width', c.w).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round'));
  g.append('path').attr('d', MAPA.edificis).attr('fill', C.edifici);
  g.append('path').attr('d', MAPA.terraMPV).attr('fill', C.marina);
  if (any !== '2010') g.append('path').attr('d', MAPA.edificiMarina).attr('fill', C.marina);
  // l'esperó entre el moll del Rellotge i el de la Barceloneta no existia el 2010
  if (any !== '2010') g.append('path').attr('d', MAPA.espero).attr('fill', C.marina);
  // MB92 (drassana): terra i naus en els colors de la base, perquè es distingeixin
  // els iots a terra dels de l'aigua
  const es24 = any === '2024';
  g.append('path').attr('d', MAPA.terraMB92).attr('fill', C.terra);
  g.append('path').attr('d', MAPA.edificisMB92).attr('fill', C.edifici);
  const dades = MAPA.anys[any];
  dades.pantalans.forEach(p => g.append('path').attr('d', p.d).attr('fill', 'none')

  }

function patroRatllat(defs, id) {
  const p = defs.append('pattern').attr('id', id).attr('patternUnits', 'userSpaceOnUse')
    .attr('width', 6).attr('height', 6);
  p.append('rect').attr('width', 6).attr('height', 6).attr('fill', C.aigua);
  p.append('line').attr('x1', 3).attr('y1', -1).attr('x2', 3).attr('y2', 7)
    .attr('stroke', C.ratlla).attr('stroke-width', 1.3).attr('stroke-opacity', 0.6);
  return p;
}

/* Silueta d'un camp de futbol (w × h en px) */
function camp(g, x, y, w, h) {
  const c = g.append('g').attr('transform', `translate(${x},${y})`);
  c.append('rect').attr('width', w).attr('height', h).attr('fill', C.camp)
    .attr('stroke', C.campLinia).attr('stroke-width', 0.75);
  if (w >= 16) {
    const st = { fill: 'none', stroke: C.campLinia, 'stroke-width': 0.6 };
    const lin = c.append('line').attr('x1', w / 2).attr('x2', w / 2).attr('y1', 0).attr('y2', h);
    const cer = c.append('circle').attr('cx', w / 2).attr('cy', h / 2).attr('r', h * 0.135);
    const ar1 = c.append('rect').attr('x', 0).attr('y', h * 0.2).attr('width', w * 0.157).attr('height', h * 0.6);
    const ar2 = c.append('rect').attr('x', w - w * 0.157).attr('y', h * 0.2).attr('width', w * 0.157).attr('height', h * 0.6);
    [lin, cer, ar1, ar2].forEach(e => Object.entries(st).forEach(([k, v]) => e.attr(k, v)));
  }
}

/* Silueta d'una illa de l'Eixample (costat a en px; mitja: només la meitat esquerra) */
function illa(g, x, y, a, mitja) {
  const f = a * ILLA.xamfra / ILLA.c;
  const pts = [[f, 0], [a - f, 0], [a, f], [a, a - f], [a - f, a], [f, a], [0, a - f], [0, f]];
  const id = 'mitja-illa-' + Math.round(x) + '-' + Math.round(y);
  const el = g.append('path').attr('d', 'M' + pts.map(p => p.join(',')).join('L') + 'Z')
    .attr('transform', `translate(${x},${y})`)
    .attr('fill', C.illa).attr('stroke', C.illaLinia).attr('stroke-width', 0.75);
  if (mitja) {
    g.append('clipPath').attr('id', id).append('rect').attr('x', -1).attr('y', -1).attr('width', a / 2 + 1).attr('height', a + 2);
    el.attr('clip-path', `url(#${id})`);
    g.append('line').attr('x1', x + a / 2).attr('x2', x + a / 2).attr('y1', y).attr('y2', y + a)
      .attr('stroke', C.illaLinia).attr('stroke-width', 0.75);
  }
}

/* Disposició vertical de 17 camps i 9,5 illes a la mateixa escala (px per metre),
   dins d'una columna d'amplada ample i alçada alt (sense comptar els textos) */
function disposaGlifs(ample, alt) {
  const gapF = 3, entre = 14;                      // entre camps · entre els dos grups
  const gapI = u => Math.max(4, 20 * u);           // carrers de l'Eixample: 20 m
  let millor = null;
  for (let nf = 1; nf <= N_CAMPS; nf++) {
    const rf = Math.ceil(N_CAMPS / nf);
    for (let ni = 1; ni <= 10; ni++) {
      const ri = Math.ceil(10 / ni);
      const mides = u => ({
        wf: nf * CAMP.w * u + (nf - 1) * gapF, wi: ni * ILLA.c * u + (ni - 1) * gapI(u),
        hf: rf * CAMP.h * u + (rf - 1) * gapF, hi: ri * ILLA.c * u + (ri - 1) * gapI(u)
      });
      let u = Math.min(ample / (nf * CAMP.w), ample / (ni * ILLA.c * 1.18), alt / (rf * CAMP.h + ri * ILLA.c * 1.18));
      for (let i = 0; i < 80; i++) {
        const m = mides(u);
        if (m.wf <= ample && m.wi <= ample && m.hf + entre + m.hi <= alt) break;
        u *= 0.97;
      }
      const m = mides(u);
      if (u <= 0 || m.wf > ample || m.wi > ample || m.hf + entre + m.hi > alt) continue;
      if (!millor || u > millor.u + 1e-6) millor = { u, nf, ni, gapF, gapI: gapI(u), entre, ...m };
    }
  }
  return millor;
}

/* Llegenda dels contorns: en una línia si hi cap; si no, en dues */
function llegenda(g, x, y, ample, px) {
  const alt = Math.round(px * 1.35) + 2, mostra = 24;
  const items = [{ t: 'Marina Port Vell', c: C.mpv }, { t: 'Marina Barcelona 92', c: C.mb92 }]
    .map(d => ({ ...d, w: mostra + 6 + mesuraText(d.t, px) }));
  const enLinia = items[0].w + 16 + items[1].w <= ample;
  items.forEach((d, i) => {
    const ix = x + (enLinia && i ? items[0].w + 16 : 0), iy = y + (enLinia ? 0 : i * alt) + alt / 2;
    g.append('line').attr('class', 'contorn').attr('x1', ix).attr('x2', ix + mostra).attr('y1', iy).attr('y2', iy)
      .attr('stroke', d.c);
    g.append('text').attr('x', ix + mostra + 6).attr('y', iy).attr('dy', '0.35em')
      .attr('font-family', 'Roboto').attr('font-size', px).attr('fill', '#232323').text(d.t);
  });
  return (enLinia ? 1 : 2) * alt;
}

function titolet(g, linies, x, y, MD) {

    { 'font-family': 'Merriweather', 'font-weight': 700, 'font-size': MD.titolet, fill: '#232323' });
  return linies.length * MD.titolet * 1.5;
}

      defs.append('clipPath').attr('id', 'clip-baix').append('rect')
        .attr('y', boxH).attr('width', colW).attr('height', totalH - boxH);
      capaBaix = g.append('g').attr('clip-path', 'url(#clip-baix)');
      dibuixaPlanol(capaBaix.append('g').attr('transform', mon), any, 'ratllat-fix');
    }
    overlays.push(g.append('rect').attr('class', 'zoom-capa').attr('width', colW).attr('height', boxH)
      .attr('fill', 'transparent').node());
  });

  /* ---------- Zoom sincronitzat ---------- */
  function aplicaZoom(t) {
    overlays.forEach(n => { n.__zoom = t; });
    capesZoom.forEach(g => g.attr('transform', t));
    patZ.attr('patternTransform', `scale(${1 / (s * t.k)}) rotate(45)`);
    const ampliat = t.k > 1.01;
    capaBaix.attr('opacity', ampliat ? 0.35 : 1);
    marcsZoom.forEach(r => r.attr('display', ampliat ? null : 'none'));
    estatZoom = { k: t.k, fx: t.x / colW, fy: t.y / boxH };
  }
  const zoom = d3.zoom()
    .scaleExtent([1, 12])
    .extent([[0, 0], [colW, boxH]])
    .translateExtent([[0, 0], [colW, boxH]])
    .filter(ev => ev.type === 'wheel' ? (ev.ctrlKey || ev.metaKey) : !ev.button)
    .on('zoom', ev => aplicaZoom(ev.transform));
  d3.selectAll(overlays).call(zoom).on('dblclick.zoom', null);
  const t0 = d3.zoomIdentity.translate(estatZoom.fx * colW, estatZoom.fy * boxH).scale(estatZoom.k);
  zoom.transform(d3.select(overlays[0]), t0);
  zoomActual = { zoom, sel: d3.select(overlays[0]) };

  // Botons de zoom: a l'esquerra del 2010 si hi caben; si no, a dins del plànol
  const zc = document.getElementById('zoom-controls');
  if (x0 >= 26 + 8 + 4) { zc.style.left = (x0 - 26 - 8) + 'px'; zc.style.top = dalt + 'px'; }
  else { zc.style.left = (x0 + 6) + 'px'; zc.style.top = (dalt + 6) + 'px'; }

  /* ---------- Sota el 2010 i el 2014: gràfic de places (i, a mòbil, la llegenda) ---------- */
  const gb = svg.append('g');
  const lx = x0, lw = 2 * colW + G;
  let ly = dalt + boxH + (M ? 10 : 16);
  const baix = dalt + totalH;
  if (M) ly += llegenda(gb, lx, ly, lw, 12.5) + 10;

  const amplePlot = Math.min(lw, 260);
  const titolCol = parteix('Evolució de les places:', amplePlot, MD.titolet, 'Merriweather', 700);
  const altEtiq = Math.round(MD.eix * 1.4);
  const fixCol = titolCol.length * MD.titolet * 1.5 + 2 + altEtiq * 2;   // títol, valors i anys
  const altCol = Math.max(24, Math.min(170, baix - ly - fixCol));
  // si sobra espai, el gràfic se centra a l'espai lliure (en horitzontal i en vertical)
  const cx = lx + (lw - amplePlot) / 2;
  ly += Math.max(0, (baix - ly - fixCol - altCol) / 2);
  ly += titolet(gb, titolCol, cx, ly, MD) + 2;
  const xb = d3.scaleBand().domain(PLACES.map(d => d.any)).range([cx, cx + amplePlot]).paddingInner(0.3).paddingOuter(0.05);
  const bw = Math.min(xb.bandwidth(), 56);
  const yb = d3.scaleLinear().domain([0, 410]).range([ly + altEtiq + altCol, ly + altEtiq]);
  const columnes = gb.selectAll('.columna').data(PLACES).join('rect').attr('class', 'columna')
    .attr('x', d => xb(d.any) + (xb.bandwidth() - bw) / 2).attr('width', bw)
    .attr('y', d => yb(d.v)).attr('height', d => yb(0) - yb(d.v))
    .attr('fill', C.columna).attr('stroke', 'rgba(0,0,0,0.2)').attr('stroke-width', 1).style('cursor', 'pointer');
  enllacaTooltip(columnes, d => `<b>${d.any}</b><br>Places per a iots: ${formatNum(d.v)}.`);
  gb.selectAll('.valor').data(PLACES).join('text').attr('class', 'valor')
    .attr('x', d => xb(d.any) + xb.bandwidth() / 2).attr('y', d => yb(d.v) - 5)
    .attr('text-anchor', 'middle').attr('font-family', 'Roboto').attr('font-weight', 700)
    .attr('font-size', MD.eix).attr('fill', '#232323').text(d => formatNum(d.v));
  gb.append('line').attr('x1', cx).attr('x2', cx + amplePlot).attr('y1', yb(0) + 0.5).attr('y2', yb(0) + 0.5)
    .attr('stroke', '#4f4f4f').attr('stroke-width', 1);
  gb.selectAll('.any').data(PLACES).join('text').attr('class', 'any')
    .attr('x', d => xb(d.any) + xb.bandwidth() / 2).attr('y', yb(0) + MD.eix + 4)
    .attr('text-anchor', 'middle').attr('font-family', 'Roboto').attr('font-size', MD.eix)
    .attr('fill', '#4f4f4f').text(d => d.any);

  if (M) return;

  /* ---------- Columna lateral (escriptori): llegenda i superfície ---------- */
  const gl = svg.append('g');
  const rx = x0 + 3 * colW + 2 * G + GL;
  let ry = dalt;
  ry += llegenda(gl, rx, ry, lat, 14) + 22;
  const titolSup = parteix('Superfície de la Marina del Port Vell:', lat, MD.titolet, 'Merriweather', 700);
  const pxXifra = 26, pxLbl = 14;                         // xifra destacada · peus de les siluetes
  const altLbl = Math.round(pxLbl * 1.4);
  const fixSup = titolSup.length * MD.titolet * 1.5 + pxXifra * 1.3 + 6 + MD.text * 1.5 + 8 + (4 + altLbl) * 2;
  const glif = disposaGlifs(lat, baix - ry - fixSup);
  if (!glif || CAMP.h * glif.u < 9) return;               // no hi cap: només la llegenda
  ry += titolet(gl, titolSup, rx, ry, MD);
  const xifra = gl.append('text').attr('x', rx).attr('y', ry + pxXifra).attr('font-family', 'Merriweather')
    .attr('font-weight', 700).attr('font-size', pxXifra).attr('fill', '#232323');
  xifra.append('tspan').text(formatNum(SUPERFICIE) + ' m');
  xifra.append('tspan').attr('font-size', pxXifra * 0.6).attr('dy', -pxXifra * 0.4).text('2');
  ry += pxXifra * 1.3 + 6;
  gl.append('text').attr('x', rx).attr('y', ry + MD.text).attr('font-family', 'Merriweather')
    .attr('font-size', MD.text).attr('fill', '#232323').text('Equival a:');
  ry += MD.text * 1.5 + 8;
  const u = glif.u, cw = CAMP.w * u, ch = CAMP.h * u, ia = ILLA.c * u;
  const mig = rx + lat / 2;                               // siluetes i peus centrats a la columna
  const peu = (y, n, t) => {
    const tx = gl.append('text').attr('x', mig).attr('y', y).attr('text-anchor', 'middle')
      .attr('font-family', 'Roboto').attr('font-size', pxLbl).attr('fill', '#232323');
    tx.append('tspan').attr('font-weight', 700).text(n);
    tx.append('tspan').text(t);
  };
  const xF = mig - glif.wf / 2, xI = mig - glif.wi / 2;
  for (let k = 0; k < N_CAMPS; k++) {
    camp(gl, xF + (k % glif.nf) * (cw + glif.gapF), ry + Math.floor(k / glif.nf) * (ch + glif.gapF), cw, ch);
  }
  ry += glif.hf + 4 + pxLbl;
  peu(ry, N_CAMPS, ' camps de futbol');
  ry += altLbl - pxLbl + glif.entre;
  for (let k = 0; k < Math.ceil(N_ILLES); k++) {
    illa(gl, xI + (k % glif.ni) * (ia + glif.gapI), ry + Math.floor(k / glif.ni) * (ia + glif.gapI), ia, k + 1 > N_ILLES);
  }
  ry += glif.hi + 4 + pxLbl;
  peu(ry, formatNum(N_ILLES), ' illes de l’Eixample');
}

/* Botons de zoom */
function zoomBoto(fn) {
  if (!zoomActual) return;
  fn(zoomActual.zoom, zoomActual.sel.transition().duration(350));
}
document.getElementById('zoom-in').addEventListener('click', ev => { ev.stopPropagation(); zoomBoto((z, s) => z.scaleBy(s, 1.6)); });
document.getElementById('zoom-out').addEventListener('click', ev => { ev.stopPropagation(); zoomBoto((z, s) => z.scaleBy(s, 1 / 1.6)); });
document.getElementById('zoom-reset').addEventListener('click', ev => { ev.stopPropagation(); zoomBoto((z, s) => z.transform(s, d3.zoomIdentity)); });

/* Redibuix en canviar la mida i quan han carregat les fonts: les mesures de
   text en depenen, i Google Fonts no descarrega una font fins que es fa servir */
let rafId;
function programaDraw() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(draw); }
if (window.ResizeObserver) new ResizeObserver(programaDraw).observe(document.getElementById('mapa-wrapper'));
else window.addEventListener('resize', programaDraw);
if (document.fonts) {
  const FONTS = ['400 12.5px Roboto', '700 12.5px Roboto', '400 14px Merriweather', '700 15px Merriweather'];
  Promise.all(FONTS.map(f => document.fonts.load(f))).then(draw, () => {});
}
draw();
</script>
